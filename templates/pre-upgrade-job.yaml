apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-preflight
  annotations:
    # This ensures the Job runs before the Deployment is updated
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      containers:
      - name: preflight-check
        image: busybox
        command: ["sh", "-c", "echo 'Validating Config...'; sleep 5; echo 'Done';"]
      restartPolicy: Never
  backoffLimit: 2
