namespace: fleet-mc-helm-external-example
  {{- if not (lookup "v1" "Secret" .Release.Namespace (include
        "BusDataRecorderDocker.fullname" . | printf "%s-rabbitmq")) }}

        apiVersion: v1

        kind: Secret

        metadata:
          name: {{ include "BusDataRecorderDocker.fullname" . }}-rabbitmq
          labels:
            app.kubernetes.io/name: {{ include "BusDataRecorderDocker.fullname" . }}
        type: Opaque

        data:
          RMQ_DEFAULT_USER: {{ .Values.env.rmqDefaultUser | b64enc | quote }}
          RMQ_DEFAULT_PASS: {{ .Values.env.rmqDefaultPass | b64enc | quote }}
        {{- end }}

